name: power_kothi
description: Power Kothi. Find EV charging stations near you.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  share_plus: ^10.0.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  image_path: assets/icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/logo_dark.png
    - assets/word.png
